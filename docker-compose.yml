version: "3.9"

# ── EntreVerse 2026 ───────────────────────────────────────────────────────────
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in your values
#   docker compose up --build
#
# The postgres container initialises the schema on first launch using init.sql.
# To wipe everything and start fresh:  docker compose down -v

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: entreverse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       entreverse
      POSTGRES_USER:     entreverse
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Schema is applied automatically on first run
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entreverse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      app_net:
        aliases:
          - postgres

  # ── Go API ─────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: entreverse_api
    restart: unless-stopped
    depends_on:
      - postgres
    # Load environment variables (ADMIN_CREDENTIALS, JWT_SECRET, etc.) from backend/.env
    env_file:
      - ./backend/.env
    environment:
      GIN_MODE:        release
      PORT:            8080
      # Connect to the postgres service at the internal container port 5432
      DATABASE_URL:    postgres://entreverse:postgres@postgres:5432/entreverse?sslmode=disable
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

volumes:
  pg_data:

networks:
  app_net:
    driver: bridge
