version: "3.9"

# ── EntreVerse 2026 ───────────────────────────────────────────────────────────
#
# Fullstack Next.js (Node.js + JavaScript) + MongoDB
#
# Usage:
#   docker compose up --build
#
# To wipe data and start fresh:  docker compose down -v

services:

  # ── MongoDB ────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: entreverse_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # ── Next.js Fullstack (Frontend + API Routes) ───────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entreverse_app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/entreverse
      JWT_SECRET: ${JWT_SECRET:-entreverse-2026-super-secret-jwt-key-change-in-prod}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@IITK2026}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks:
      - app_net

volumes:
  mongo_data:

networks:
  app_net:
    driver: bridge
