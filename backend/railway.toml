# railway.toml — EntreVerse backend deployment config
# Docs: https://docs.railway.com/reference/config-as-code

[build]
# Build the Docker image from the backend directory.
# Railway auto-detects the Dockerfile at the repo root of the service.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects PORT automatically; the Go server reads it from the env.
startCommand = "./server"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
